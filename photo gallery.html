.footer{

    height: auto;
   
   
   

}

.footer ul{
    text-align: start;
    margin: 24px;
    padding: 24px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    cursor:pointer;


}
.footer li{
    margin: 25px 0px;
    transition: 0.2s;

    &:hover{
        word-spacing: 6px;
        letter-spacing: 6px;
    }
}

.footer img{
    height: 25px;
    justify-content: space-between;
    margin: 24px;
    cursor: default;
    transition: 0.2s;

    &:hover{
        color: white;
        filter: drop-shadow(2px 5px 12px white);
        margin-top: 3px;
        background: none;
    }
    
    
}
.footer span{
    font-size: 10px;
}

.footer a{
    text-decoration: none;
    color: beige;
    cursor: default;
}
.list img{
     width: 100%;
     margin-bottom: 1em;
     animation: appear  linear;
     animation-timeline: view();
     animation-range: entry 0% cover 35%;
     transition: 0.6s;
     
     &:hover{
        border-radius: 50px;
      
    
}
}
@keyframes appear{
    from{
        opacity: 0;
        scale: 0.4;
    }
    to{
        opacity: 1;
        scale:1;
    }
}
.list{
    /* column-count: 3; */
    columns: 300px;
